<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Вход — Office Radio Overlay</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=1">
    <script>
        (function() {
            // ?theme=light|dark — чтобы тему можно было задать ссылкой
            var forced = new URLSearchParams(location.search).get('theme');
            if (forced === 'light' || forced === 'dark') {
                try { localStorage.setItem('evraz_theme', forced); } catch (e) {}
            }
            var t = forced || localStorage.getItem('evraz_theme') || 'dark';
    if (t !== 'light' && t !== 'winamp') t = 'dark';
            document.documentElement.setAttribute('data-theme', (t === 'light' || t === 'winamp') ? t : 'dark');
        })();
    </script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
<div class="auth-chassis">
    <button type="button" id="login-theme" class="auth-theme-btn"
            title="Переключить тему (тёмная / светлая)">☾</button>
    <div class="auth-stack">

        <div class="auth-module auth-display">
            <h1>Office Radio</h1>
            <div class="auth-subtitle">Overlay · Model R-01</div>
        </div>

        <div class="auth-module">
            {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
            <form method="post">
                <div class="auth-field">
                    <label>Оператор</label>
                    <input name="username" autofocus required autocomplete="username">
                </div>
                <div class="auth-field">
                    <label>Ключ доступа</label>
                    <input name="password" type="password" required autocomplete="current-password">
                </div>
                <div class="auth-actions">
                    <button type="submit" class="auth-knob-btn" title="Войти">On&nbsp;Air</button>
                </div>
            </form>
        </div>

        <div class="auth-module">
            <div class="auth-knobs">
                <div class="auth-knob-item">
                    <div class="auth-knob"></div>
                    <div class="auth-knob-label">VOL</div>
                </div>
                <div class="auth-knob-item">
                    <div class="auth-knob"></div>
                    <div class="auth-knob-label">TONE</div>
                </div>
                <div class="auth-knob-item">
                    <div class="auth-knob"></div>
                    <div class="auth-knob-label">TUNE</div>
                </div>
            </div>
        </div>

        <div class="auth-footer">{{ footer or "ON AIR · SINCE 1930" }}</div>
    </div>
</div>
<script>
    (function () {
        var btn = document.getElementById('login-theme');
        if (!btn) return;
        var THEMES = ['dark', 'light', 'winamp'];
        function icon(t) {
            return t === 'winamp' ? '🎵' : (t === 'light' ? '☀' : '☾');
        }
        var cur = document.documentElement.getAttribute('data-theme') || 'dark';
        btn.textContent = icon(cur);
        btn.title = 'Тема: ' + cur + ' (нажмите, чтобы сменить)';
        btn.onclick = function () {
            var now = document.documentElement.getAttribute('data-theme') || 'dark';
            var next = THEMES[(THEMES.indexOf(now) + 1) % THEMES.length];
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('evraz_theme', next); } catch (e) {}
            btn.textContent = icon(next);
            btn.title = 'Тема: ' + next;
        };
    })();
</script>
</body>
</html>
